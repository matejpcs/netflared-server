name: Build & Release Paper compatibility bundles

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Netflared plugin release version
        required: true
        default: "0.1.4"
  push:
    tags:
      - "server-v*"

permissions:
  contents: write

env:
  GRADLE_VERSION: "9.7.1"

jobs:
  build-1-20:
    name: Paper 1.20.x / ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { paper: "1.20", apiPaper: "1.20-R0.1-SNAPSHOT", java: "17", api: "1.20" }
          - { paper: "1.20.1", apiPaper: "1.20.1-R0.1-SNAPSHOT", java: "17", api: "1.20" }
          - { paper: "1.20.2", apiPaper: "1.20.2-R0.1-SNAPSHOT", java: "17", api: "1.20" }
          - { paper: "1.20.3", apiPaper: "1.20.3-R0.1-SNAPSHOT", java: "17", api: "1.20" }
          - { paper: "1.20.4", apiPaper: "1.20.4-R0.1-SNAPSHOT", java: "17", api: "1.20" }
          - { paper: "1.20.5", apiPaper: "1.20.6-R0.1-SNAPSHOT", java: "21", api: "1.20" }
          - { paper: "1.20.6", apiPaper: "1.20.6-R0.1-SNAPSHOT", java: "21", api: "1.20" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paper/1.20.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build and test
        run: |
          gradle clean build --no-daemon \
            -PpluginVersion="${{ inputs.release_version || '0.1.4' }}" \
            -PpaperVersion="${{ matrix.apiPaper }}" \
            -PjavaVersion="${{ matrix.java }}" \
            -PapiVersion="${{ matrix.api }}" \
            -PartifactVersion="${{ matrix.paper }}"
      - uses: actions/upload-artifact@v4
        with:
          name: netflared-1.20-${{ matrix.paper }}
          path: build/libs/netflared-server-${{ matrix.paper }}.jar
          if-no-files-found: error

  build-1-21:
    name: Paper 1.21.x / ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { paper: "1.21", apiPaper: "1.21-R0.1-SNAPSHOT" }
          - { paper: "1.21.1", apiPaper: "1.21.1-R0.1-SNAPSHOT" }
          - { paper: "1.21.2", apiPaper: "1.21.1-R0.1-SNAPSHOT" }
          - { paper: "1.21.3", apiPaper: "1.21.3-R0.1-SNAPSHOT" }
          - { paper: "1.21.4", apiPaper: "1.21.4-R0.1-SNAPSHOT" }
          - { paper: "1.21.5", apiPaper: "1.21.5-R0.1-SNAPSHOT" }
          - { paper: "1.21.6", apiPaper: "1.21.6-R0.1-SNAPSHOT" }
          - { paper: "1.21.7", apiPaper: "1.21.7-R0.1-SNAPSHOT" }
          - { paper: "1.21.8", apiPaper: "1.21.8-R0.1-SNAPSHOT" }
          - { paper: "1.21.9", apiPaper: "1.21.9-R0.1-SNAPSHOT" }
          - { paper: "1.21.10", apiPaper: "1.21.10-R0.1-SNAPSHOT" }
          - { paper: "1.21.11", apiPaper: "1.21.11-R0.1-SNAPSHOT" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paper/1.21.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build and test
        run: |
          gradle clean build --no-daemon \
            -PpluginVersion="${{ inputs.release_version || '0.1.4' }}" \
            -PpaperVersion="${{ matrix.apiPaper }}" \
            -PjavaVersion="21" \
            -PapiVersion="1.21" \
            -PartifactVersion="${{ matrix.paper }}"
      - uses: actions/upload-artifact@v4
        with:
          name: netflared-1.21-${{ matrix.paper }}
          path: build/libs/netflared-server-${{ matrix.paper }}.jar
          if-no-files-found: error

  build-26:
    name: Paper 26.x / ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { paper: "26.1.1", api: "26.1" }
          - { paper: "26.1.2", api: "26.1" }
          - { paper: "26.2", api: "26.2" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paper/26.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build and test
        run: |
          gradle clean build --no-daemon \
            -PpluginVersion="${{ inputs.release_version || '0.1.4' }}" \
            -PpaperVersion="${{ matrix.paper }}.build.+" \
            -PjavaVersion="25" \
            -PapiVersion="${{ matrix.api }}" \
            -PartifactVersion="${{ matrix.paper }}"
      - uses: actions/upload-artifact@v4
        with:
          name: netflared-26-${{ matrix.paper }}
          path: build/libs/netflared-server-${{ matrix.paper }}.jar
          if-no-files-found: error

  all-builds:
    name: All Paper compatibility builds passed
    needs: [build-1-20, build-1-21, build-26]
    if: ${{ always() && needs.build-1-20.result == 'success' && needs.build-1-21.result == 'success' && needs.build-26.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "All 22 Paper compatibility builds passed. Releases may be published."

  release-1-20:
    name: Release Paper 1.20.x
    needs: all-builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: netflared-1.20-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.release_version || '0.1.4' }}-1.20.x"
          name: "Netflared Server ${{ inputs.release_version || '0.1.4' }} — Paper 1.20.x"
          target_commitish: paper/1.20.x
          generate_release_notes: true
          files: release/*.jar

  release-1-21:
    name: Release Paper 1.21.x
    needs: all-builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: netflared-1.21-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.release_version || '0.1.4' }}-1.21.x"
          name: "Netflared Server ${{ inputs.release_version || '0.1.4' }} — Paper 1.21.x"
          target_commitish: paper/1.21.x
          generate_release_notes: true
          files: release/*.jar

  release-26:
    name: Release Paper 26.x
    needs: all-builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: netflared-26-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.release_version || '0.1.4' }}-26.x"
          name: "Netflared Server ${{ inputs.release_version || '0.1.4' }} — Paper 26.x"
          target_commitish: paper/26.x
          generate_release_notes: true
          files: release/*.jar
