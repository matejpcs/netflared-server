name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Netflared Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="build-$GITHUB_RUN_NUMBER"
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test plugin
        run: gradle clean build --no-daemon -PpluginVersion="${{ steps.release.outputs.version }}"

      - name: Find plugin JAR
        id: jar
        shell: bash
        run: |
          mapfile -t JARS < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print
          )

          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "Expected exactly one plugin JAR, found ${#JARS[@]}:"
            printf '  %s\n' "${JARS[@]}"
            exit 1
          fi

          echo "Found plugin: ${JARS[0]}"
          echo "jar=${JARS[0]}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Netflared Server ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.jar.outputs.jar }}
